[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bugcontrol"
version = "0.1.0"
description = "Bug bounty program/scope watcher with Telegram ops and Cursor cloud agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "apscheduler>=3.10",
  "python-telegram-bot>=21.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "cursor-sdk>=0.1",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
bugcontrol = "bugcontrol.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bugcontrol = ["db/schema.sql"]
